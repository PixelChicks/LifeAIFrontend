<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">

<head>

    <th:block th:insert="~{fragments/links}"></th:block>
    <style>
    .search-box {
        display: flex;
        align-items: center;
        margin-top: 20px;
    }
    .search-box input[type="text"] {
        border-radius: 50px 0 0 50px;
        padding-left: 20px;
        border-right: none;
    }

    .search-box button {
        border-radius: 0 50px 50px 0;
    }

    .search-box .input-group {
        flex-grow: 1;
    }

    .search-box .btn {
        background-color: #007bff;
        color: white;
    }

    .btn-primary {
        width: 90%;
        max-width: 500px;
        padding: 15px 20px;
        font-size: 18px;
        text-align: center;
        border-radius: 50px;
    }

    .btn-danger {
        width: 100%;
        max-width: 500px;
        padding: 15px 20px;
        font-size: 18px;
        text-align: center;
        border-radius: 50px;
    }

    .content {
        max-width: 600px;
        margin: 0 auto;
        padding: 20px;
    }

    .section {
        margin-bottom: 40px;
    }

    .section h2 {
        font-size: 24px;
        margin-bottom: 15px;
    }

    .section p {
        margin: 10px 0;
        line-height: 1.6;
    }

    .label {
        display: inline-block;
        background-color: #1C9473;
        color: white;
        padding: 5px 10px;
        border-radius: 20px;
        font-size: 14px;
        margin-bottom: 10px;
    }
    </style>
</head>

<body>
<th:block th:insert="~{fragments/tagManager}"></th:block>

<!-- Spinner Start -->
<div id="spinner"
     class="show bg-white position-fixed translate-middle w-100 vh-100 top-50 start-50 d-flex align-items-center justify-content-center">
    <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status">
        <span class="sr-only">Loading...</span>
    </div>
</div>
<!-- Spinner End -->


<!-- Navbar & Hero Start -->
<div class="container-fluid p-0">

        <a href="javascript:history.back()" class="back-icon" id="backButton" style="margin-top: 10px;">

            <svg xmlns="http://www.w3.org/2000/svg" width="35" height="35" fill="currentColor" class="bi bi-arrow-left"

                      d="M15 8a.5.5 0 0 1-.5.5H4.707l3.147 3.146a.5.5 0 0 1-.708.708l-4-4a.5.5 0 0 1 0-.708l4-4a.5.5 0 0 1 .708.708L4.707 7.5H14.5A.5.5 0 0 1 15 8z"/>
            </svg>

            <img src="/img/logo.png" alt="Life AI Logo" style="margin-top: 50px;">
        </a>
    </nav>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.1.3/js/bootstrap.bundle.min.js"></script>
<script>
    // Check if the current URL path includes "info"
    if (window.location.pathname.includes('info')) {
        // Hide the back button if "info" is part of the URL path
        document.getElementById('backButton').style.display = 'none';
    }
</script>
<!-- Navbar & Hero End -->
<style>
    .navbar {
        justify-content: center; /* Center the navbar content */
        position: relative; /* Allows absolute positioning for the back icon */
    }
    .navbar-brand {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
    }
    .back-icon {
        position: absolute;
        left: 20px;
        top: 50%;
        transform: translateY(-50%);
        cursor: pointer;
    }

    .bottom-nav {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        background: #F8F8F8;
        box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.1);
        display: flex;
        justify-content: space-around;
        padding: 10px 0;
        z-index: 10;
    }

    .nav-item {
        text-align: center;
        font-size: 14px;
        color: #8E8E93; /* Default gray */
        display: flex;
        flex-direction: column;
        align-items: center;
        transition: color 0.3s ease-in-out;
    }

    .nav-item i {
        font-size: 24px; /* Adjust icon size */
        margin-bottom: 5px;
    }

    .nav-item p {
        margin: 0;
        font-size: 12px;
    }

    /* Active Item */
    .nav-item.active {
        color: #2E1E46; /* Dark purple */
        font-weight: bold;
    }

    .nav-item.active i {
        color: #2E1E46;
    }

</style>

<div style="margin-top:-60px; width: 100%; height: 100%; text-align: center; color: black; font-size: 18px; font-family: Inter; font-weight: 400; word-wrap: break-word">
    Започнете да изпълнявате упражненията от 7-мия ден след операцията.</div>

<div class="container-fluid overflow-hidden py-1 mt-1">
    <br>
    <center>
        <div class="exercise-container" style="max-width: 600px;">
            <a class="exercise-card" href="/stickExercises">
                <img alt="Упражнение с пръчка" src="/img/upraznenie-prychka.png">

            </a>
            <a class="exercise-card" href="/spadeStretching">
                <img alt="Разтягане на лопатките" src="/img/raztiagane-lopatki.png">
                <p>Разтягане на лопатките</p>
            </a>
            <a class="exercise-card" href="/shoulderBlades">
                <img alt="Събиране на лопатките" src="/img/sybirane-lopatki.png">
                <p>Събиране на лопатките</p>
            </a>
            <a class="exercise-card" href="/tiltSide">
                <img alt="Наклони встрани" src="/img/nakloni-vstrani.png">

            </a>
            <a class="exercise-card" href="/chestStretch">
                <img alt="Разтягане на гръден кош" src="/img/raztiagane-gryden-kosh.png">
                <p>Разтягане на гръден кош</p>
            </a>
            <a class="exercise-card" href="/shoulderStretch">
                <img alt="Разтягане на раменете" src="/img/raztiagane-ramene.png">
                <p>Разтягане на раменете</p>
            </a>
        </div>
        <br><br>
        <center>
            <a href="/home" class="btn btn-danger w-100 py-3">Към началната страница</a>
        </center>
    </center>
    <br> <br> <br>
    <th:block th:insert="~{fragments/feedback}"></th:block>
    <br> <br>
</div>

<th:block th:insert="~{fragments/footer}"></th:block>

<style>
    .hidden-content {
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.5s ease-out;
    }

    .show-content {
        max-height: 10000px;
        transition: max-height 0.5s ease-in;
    }

    .exercise-container {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        justify-content: center;
    }

    .exercise-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-decoration: none;
        border-radius: 10px;
        padding: 20px;
        background-color: #FAF0FF;
        width: 150px;
        transition: transform 0.3s, box-shadow 0.3s;
    }

    .exercise-card:hover {
        transform: scale(1.05);
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .exercise-card img {
        width: 100px;
        height: 100px;
        margin-bottom: 10px;
    }

    .exercise-card p {
        margin: 0;
        color: #333;
        font-size: 16px;
        text-align: center;
    }

</style>

<script>
    document.getElementById("readMoreBtn").addEventListener("click", function () {
        var moreContent = document.getElementById("moreContent");
        var button = document.getElementById("readMoreBtn");

        if (moreContent.classList.contains("show-content")) {
            moreContent.classList.remove("show-content");
            button.textContent = "Прочети повече"; // Change button text to "Read More"
        } else {
            moreContent.classList.add("show-content");
            button.textContent = "Прочети по-малко"; // Change button text to "Read Less"
        }
    });
</script>
</body>

</html>
