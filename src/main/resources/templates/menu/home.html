<!DOCTYPE html>
<html lang="en" xmlns:th="">

<head>
    <meta charset="utf-8">
    <title>Life</title>
    <link href="/img/file.svg">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="" name="keywords">
    <meta content="" name="description">
    <th:block th:insert="~{fragments/links}"></th:block>
    <style>
        .spinner {
            opacity: 80%;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 5px solid #ff91b6;
            border-bottom: 5px solid #b81d53;
            animation: spin 2s linear infinite;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .search-box {
            display: flex;
            align-items: center;
            border: 3px solid #6ec4b0;
            border-radius: 55px;
            padding: 3px 3px;
            background: white;
        }

        .search-box input {
            border: none;
            outline: none;
            font-size: 16px;
            padding: 8px;
            flex: 1;
        }

        .search-box button {
            background: none;
            border: none;
            cursor: pointer;
        }

        .btn-primary {
            width: 90%;
            max-width: 500px;
            padding: 15px 20px;
            font-size: 18px;
            text-align: center;
            border-radius: 50px;
        }

        .btn-danger {
            width: 100%;
            max-width: 500px;
            padding: 15px 20px;
            font-size: 18px;
            text-align: center;
            border-radius: 50px;
        }

        #loadingText {
            font-size: 14px;
            color: #888;
            font-style: italic;
            text-align: center;
            margin-top: 10px;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        .typing-bubble {
            display: flex;
            gap: 5px;
            align-items: center;
            justify-content: center;
            margin-top: 6px;
        }

        .typing-bubble span {
            width: 15px;
            height: 15px;
            background-color: #ff6f91;
            border-radius: 50%;
            animation: typing 1.5s infinite;
        }

        .typing-bubble span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-bubble span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 80%, 100% {
                transform: scale(0);
            }
            40% {
                transform: scale(1);
            }
        }

        .quote-box {
            position: relative;
            background: url('/img/ribbon.png') no-repeat center center;
            background-size: cover;
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            font-size: 1.2em;
            font-style: italic;
            color: white;
            font-weight: bold;
            width: 80%;
            max-width: 500px;
            margin: 20px auto;
        }

        .quote-box::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgb(47 27 86 / 56%);
            border-radius: 20px;
        }

        .quote-text {
            position: relative;
            z-index: 1;
        }

        .card {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 376px;
            height: 171px;
            border-radius: 20px;
            padding-bottom: 20px;
            background-color: #FFE5E5;
        }

        .card img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .text {
            position: absolute;
            top: 35px;
            left: 35px;
            right: 35px;
            bottom: 35px;
            font-family: 'Inter', sans-serif;
            font-size: 18px;
            font-style: italic;
            color: #fff;
            line-height: 1.4;
            overflow-wrap: break-word;
            max-width: calc(100% - 70px);
            word-wrap: normal;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .challenge-item {
            background: white;
            border-radius: 40px;
            padding: 18px 20px;
            margin-bottom: -5px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 15px;
            border: 2px solid #70707082;
            cursor: pointer;
            text-decoration: none;
        }

        .challenge-row {
            display: flex;
            align-items: center;
            gap: 15px;
            width: 100%;
        }

        .challenge-number {
            background: linear-gradient(135deg, #ff6b9d 0%, #ff4081 100%);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        .challenge-number.completed {
            background: #8D78AD;
        }

        .challenge-number .number-text {
            display: block;
        }

        .challenge-number .check-icon {
            display: none;
            font-size: 22px;
        }

        .challenge-number.completed .number-text {
            display: none;
        }

        .challenge-number.completed .check-icon {
            display: block;
        }

        .challenge-text {
            flex: 1;
            font-size: 18px;
            text-align: left;
            color: #2E1E46;
            font-weight: 500;
        }

        .mood-selector {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            width: 100%;
            margin-top: 5px;
        }

        .mood-selector img {
            width: 45px;
            height: 45px;
            cursor: pointer;
            transition: transform 0.2s ease;
            opacity: 0.6;
        }

        .mood-selector img:hover {
            transform: scale(1.1);
            opacity: 0.9;
        }

        .mood-selector {
            position: relative;
        }

        .mood-selector img {
            position: relative;
        }

        /* Selected emoji base style */
        .mood-selector img.selected {
            opacity: 1;
        }

        .mood-wrapper {
            position: relative;
            width: 45px;
            height: 45px;
        }

        .mood-wrapper.selected::after {
            content: "";
            position: absolute;
            top: -6px;
            right: -6px;

            width: 18px;
            height: 18px;

            background-color: #7b3fe4;
            background-image: url("/icons/check.svg");
            background-repeat: no-repeat;
            background-position: center;
            background-size: 10px 10px;

            border-radius: 50%;

            box-shadow: 0 2px 6px rgba(0,0,0,0.25);
        }

        .mood-success-message {
            text-align: center;
            color: #28a745;
            font-size: 14px;
            margin-top: 10px;
            font-weight: 500;
            display: none;
        }

        .mood-success-message.show {
            display: block;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .content-spacer {
            height: 80px;
        }

        .navbar {
            justify-content: center;
            position: relative;
        }

        .navbar-brand {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }

        .back-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #F8F8F8;
            box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 10;
        }

        .nav-item {
            text-align: center;
            font-size: 14px;
            color: #8E8E93;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: color 0.3s ease-in-out;
        }

        .nav-item i {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .nav-item p {
            margin: 0;
            font-size: 12px;
        }

        .nav-item.active {
            color: #2E1E46;
            font-weight: bold;
        }

        .nav-item.active i {
            color: #2E1E46;
        }
    </style>
</head>

<body>
<th:block th:insert="~{fragments/tagManager}"></th:block>

<!-- Spinner Start -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.1.3/js/bootstrap.bundle.min.js"></script>

<!-- Header Start -->

        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
    </ul>
    <div class="container text-center py-5" style="max-width: 900px;">
        <h1 class="display-3 mb-4 wow fadeInDown"
            th:text="${userName != null} ? 'Здравей, ' + ${userName} + '!' : 'Life'">Life</h1>

    <div class="d-flex justify-content-center">

    <script async src="https://scripts.gktab.com/appkey=4429d9c6-a362-4c9c-8709-2313a4bc5b00"></script>

<!-- Contact Start -->
<center>
    <div style="max-width: 600px; margin-top: -100px;">
        <br>
        <div class="container py-0">
            <div class="text-center mx-auto mb-5 wow fadeInUp" data-wow-delay="0.1s" style="max-width: 600px;">
                <br>
                <div th:if="${session.ACCESS_TOKEN != null}">
                    <a th:href="@{/logout}">Logout</a>
                </div>

                <div class="d-flex align-items-center mb-4">
                    <h2 class="display-6 mb-1" style="text-align: center; margin-left: 15px;">ПРЕДИЗВИКАТЕСТВА НА

                </div>

            <div class="row g-5 align-items-center">

                                        <div class="challenge-number" data-challenge="1">
                                            <span class="number-text">1</span>
                                            <img alt="check" class="check-icon" src="/icons/check.svg">
                                        </div>
                                        <div class="challenge-text">Как си днес?</div>
                                    </div>

                                    <div class="mood-selector">
                                        <div class="mood-wrapper">
                                            <img class="mood-emoji" data-mood="5" src="/img/mood5.svg">
                                        </div>
                                        <div class="mood-wrapper">
                                            <img alt="Щастлив" class="mood-emoji" data-mood="4" src="/img/mood1.svg">

                                        <div class="mood-wrapper">

                                        </div>
                                        <div class="mood-wrapper">

                                        </div>
                                        <div class="mood-wrapper">

                                        </div>
                                    </div>

                                </div>
                            </div>

                            <!-- Challenge 2 -->

                                <a class="challenge-link" data-challenge="2" href="/exercises"

                                        <div class="challenge-row">

                                            </div>

                                        </div>
                                    </div>
                                </a>
                            </div>

                                   style="text-decoration: none;">
                                    <div class="challenge-item">
                                        <div class="challenge-row">
                                            <div class="challenge-number" data-challenge="3">
                                                <span class="number-text">3</span>
                                                <img alt="check" class="check-icon" src="/icons/check.svg">
                                            </div>
                                            <div class="challenge-text">Сготви нещо полезно</div>
                                        </div>

                                    <div class="challenge-item">
                                        <div class="challenge-row">

</center>

<div class="content-spacer"></div>

<!-- Contact End -->
<th:block th:insert="~{fragments/footer}"></th:block>

<script>
    // Load today's progress on page load
    async function loadTodaysProgress() {
        try {
            const response = await fetch('/api/progress/today');
            if (response.ok) {
                const progressData = await response.json();
                if (progressData && progressData.completedChallenges) {
                    // Mark completed challenges
                    progressData.completedChallenges.forEach(challengeNum => {
                        markChallengeComplete(challengeNum, false);
                    });
                }
            }
        } catch (error) {
            console.log('No progress data for today yet');
        }
    }

    // Load today's mood on page load
    async function loadTodaysMood() {
        try {
            const response = await fetch('/api/mood/today');
            if (response.ok) {
                const moodData = await response.json();
                if (moodData && moodData.moodLevel) {
                    const moodEmoji = document.querySelector(`.mood-emoji[data-mood="${moodData.moodLevel}"]`);
                    if (moodEmoji) {
                        moodEmoji.classList.add('selected');
                        moodEmoji.parentElement.classList.add('selected');
                    }
                }
            }
        } catch (error) {
            console.log('No mood saved for today yet');
        }
    }

    // Mark a challenge as complete
    function markChallengeComplete(challengeNumber, animate = true) {
        const challengeElement = document.querySelector(`.challenge-number[data-challenge="${challengeNumber}"]`);
        if (challengeElement && !challengeElement.classList.contains('completed')) {
            if (animate) {
                challengeElement.style.transform = 'scale(1.2)';
                setTimeout(() => {
                    challengeElement.style.transform = 'scale(1)';
                }, 300);
            }
            challengeElement.classList.add('completed');
        }
    }

    // Save challenge completion to backend
    async function saveChallengeComplete(challengeNumber) {
        try {
            const response = await fetch('/api/progress/complete', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ challengeNumber: challengeNumber })
            });

            if (response.ok) {
                markChallengeComplete(challengeNumber, true);
                console.log(`Challenge ${challengeNumber} marked complete`);
            }
        } catch (error) {
            console.error('Error saving challenge completion:', error);
        }
    }

    // Mood selector functionality
    document.querySelectorAll('.mood-emoji').forEach(emoji => {
        emoji.addEventListener('click', async function(e) {
            e.preventDefault();
            e.stopPropagation();

            const mood = parseInt(this.getAttribute('data-mood'));

            // Clear previous selections
            document.querySelectorAll('.mood-emoji').forEach(e => {
                e.classList.remove('selected');
                e.parentElement.classList.remove('selected');
            });

            // Select current
            this.classList.add('selected');
            this.parentElement.classList.add('selected');

            try {
                const response = await fetch('/api/mood', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ moodLevel: mood })
                });

                if (response.ok) {
                    const successMsg = document.getElementById('moodSuccessMsg');
                    successMsg.classList.add('show');

                    markChallengeComplete(1, true);

                    setTimeout(() => {
                        successMsg.classList.remove('show');
                    }, 3000);
                } else {
                    alert('Не успяхме да запазим твоето настроение.');
                }
            } catch (error) {
                alert('Грешка при запазване.');
            }
        });
    });

    // Handle challenge link clicks
    document.querySelectorAll('.challenge-link').forEach(link => {
        link.addEventListener('click', function(e) {
            const challengeNum = parseInt(this.getAttribute('data-challenge'));
            // Mark as complete before navigating
            saveChallengeComplete(challengeNum);
        });
    });

    // Load progress and mood when page loads
    document.addEventListener('DOMContentLoaded', function() {
        loadTodaysProgress();
        loadTodaysMood();
    });
</script>
</body>

</html>
