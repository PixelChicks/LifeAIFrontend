<!DOCTYPE html>
<html lang="en" xmlns:th="">

<head>
    <meta charset="utf-8">
    <title>Life</title>
    <link href="/img/file.svg">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="" name="keywords">
    <meta content="" name="description">
    <th:block th:insert="~{fragments/links}"></th:block>
    <style>

        .spinner {
            opacity: 80%;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 5px solid #ff91b6;
            border-bottom: 5px solid #b81d53;
            animation: spin 2s linear infinite;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg); /* Start at 0 degrees */
            }
            100% {
                transform: rotate(360deg); /* Rotate to 360 degrees */
            }
        }
        .search-box {
            display: flex;
            align-items: center;
            border: 3px solid #6ec4b0;
            border-radius: 55px;
            padding: 3px 3px;
            background: white;
        }
        .search-box input {
            border: none;
            outline: none;
            font-size: 16px;
            padding: 8px;
            flex: 1;
        }
        .search-box button {
            background: none;
            border: none;
            cursor: pointer;
        }


        .btn-primary {
            width: 90%;
            max-width: 500px;  /* Adjust as per your layout */
            padding: 15px 20px;
            font-size: 18px;  /* Adjust font size if needed */
            text-align: center;
            border-radius: 50px;
        }
                .btn-danger {
            width: 100%;
            max-width: 500px;  /* Adjust as per your layout */
            padding: 15px 20px;
            font-size: 18px;  /* Adjust font size if needed */
            text-align: center;
            border-radius: 50px;
        }

         #loadingText {
            font-size: 14px;
            color: #888;
            font-style: italic;
            text-align: center;
            margin-top: 10px;
        }

        * {
             box-sizing: border-box;
        }

         html, body {
             margin: 0;
             padding: 0;
             overflow-x: hidden;
         }

        .typing-bubble {
            display: flex;
            gap: 5px;
            align-items: center;
            justify-content: center;
            margin-top: 6px;
        }

        .typing-bubble span {
            width: 15px;
            height: 15px;
            background-color: #ff6f91;
            border-radius: 50%;
            animation: typing 1.5s infinite;
        }

        .typing-bubble span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-bubble span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 80%, 100% {
                transform: scale(0);
            }
        40% {
                transform: scale(1);
            }
        }
        .quote-box {
            position: relative;
            background: url('/img/ribbon.png') no-repeat center center;
            background-size: cover;
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            font-size: 1.2em;
            font-style: italic;
            color: white;
            font-weight: bold;
            width: 80%;
            max-width: 500px;
            margin: 20px auto;
        }

        /* Overlay Effect */
        .quote-box::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgb(47 27 86 / 56%);
            border-radius: 20px;
        }

        /* Text should be on top of the overlay */
        .quote-text {
            position: relative;
            z-index: 1;
        }

    .card {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    width: 376px; /* Matches SVG dimensions */
    height: 171px; /* Matches SVG dimensions */
    border-radius: 20px; /* Matches SVG rx */
    padding-bottom: 20px;
    background-color: #FFE5E5; /* Fallback for when the image isn't loaded */
}

.card img {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover; /* Ensures it scales correctly */
}


     .text {
    position: absolute;
    top: 35px;
    left: 35px;
    right: 35px;
    bottom: 35px;
    font-family: 'Inter', sans-serif;
    font-size: 18px;
    font-style: italic;
    color: #fff;
    line-height: 1.4;
    overflow-wrap: break-word;
    max-width: calc(100% - 70px);
    word-wrap: normal;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
}
    </style>
</head>

<script>

</script>

<style>

<script>
    const form = document.getElementById("chatForm");

        form.querySelector("button[type='submit']").disabled = true;
