<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рецепти - Life</title>
    <link href="/img/file.svg" rel="icon">
    <th:block th:insert="~{fragments/links}"></th:block>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f8f8f8;
        }

        /* Filter buttons styling */
        .filter-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
            background: white;
        }

        .filter-btn {
            background: #faebeb;
            border: none;
            border-radius: 12px;
            padding: 15px;
            font-size: 14px;
            font-weight: 500;
            color: #2E1E46;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: flex-start;
            text-decoration: none;
        }

        .filter-btn:hover {
            background: #ffe8f2;
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #ff6b9d 0%, #ff4081 100%);
            color: white;
        }

        .filter-btn svg {
            width: 22px;
            height: 22px;
        }

        /* Recipe card styling */
        .recipe-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 15px;
            transition: transform 0.2s ease;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: row;
        }

        .recipe-card:hover {
            transform: translateY(-2px);
        }

        .recipe-content {
            flex: 1;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .recipe-image {
            width: 100px;
            height: 100px;
            object-fit: cover;
            flex-shrink: 0;
            background: linear-gradient(135deg, #ff6b9d 0%, #ff4081 100%);
            border-radius: 8px;
            margin: 10px;
        }

        .recipe-title {
            font-size: 20px;
            font-weight: 600;
            color: #2E1E46;
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .recipe-description {
            font-size: 12px;
            color: #888;
            line-height: 1.6;
            margin-bottom: 10px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            word-break: break-word;
        }

        .recipe-meta {
            display: flex;
            gap: 15px;
            font-size: 11px;
            color: #999;
        }

        .recipe-meta-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .recipes-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 0 20px 100px 20px;
        }

        .section-title {
            text-align: left;
            font-size: 16px;
            font-weight: 600;
            color: #2E1E46;
            margin: 20px 0 15px 0;
        }

        .no-recipes {
            text-align: center;
            padding: 40px 20px;
            color: #888;
            font-size: 14px;
        }

        /* Pagination */
        .pagination-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin: 30px 0;
        }

        .pagination-btn {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #2E1E46;
            text-decoration: none;
        }

        .pagination-btn:hover:not(.disabled) {
            border-color: #ff6b9d;
            background: #fff5f8;
        }

        .pagination-btn.disabled {
            opacity: 0.3;
            cursor: not-allowed;
            pointer-events: none;
        }

        .page-info {
            font-size: 14px;
            color: #666;
        }
    </style>
</head>

<body>
<th:block th:insert="~{fragments/tagManager}"></th:block>

<!-- Spinner Start -->
<div class="show bg-white position-fixed translate-middle w-100 vh-100 top-50 start-50 d-flex align-items-center justify-content-center"
     id="spinner">
    <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
        <span class="sr-only">Loading...</span>
    </div>
</div>
<!-- Spinner End -->

<!-- Navbar Start -->
<div class="container-fluid p-0">
    <nav class="navbar navbar-expand-lg navbar-light bg-transparent px-4 px-lg-5 py-5 py-lg-0 sticky-top">
        <a class="back-icon" href="/home" style="margin-top: 10px;">
            <svg class="bi bi-arrow-left" fill="currentColor" height="35" viewBox="0 0 16 16" width="35"
                 xmlns="http://www.w3.org/2000/svg">
                <path d="M15 8a.5.5 0 0 1-.5.5H4.707l3.147 3.146a.5.5 0 0 1-.708.708l-4-4a.5.5 0 0 1 0-.708l4-4a.5.5 0 0 1 .708.708L4.707 7.5H14.5A.5.5 0 0 1 15 8z"
                      fill-rule="evenodd"/>
            </svg>
        </a>
        <a class="navbar-brand p-0" href="/home">
            <img alt="Life AI Logo" src="/img/logo.png" style="margin-top: 50px;">
        </a>
    </nav>
</div>

<style>
    .navbar {
        justify-content: center;
        position: relative;
    }
    .navbar-brand {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
    }
    .back-icon {
        position: absolute;
        left: 20px;
        top: 50%;
        transform: translateY(-50%);
        cursor: pointer;
    }
</style>
<!-- Navbar End -->

<!-- Header Start -->
<div class="container-fluid bg-breadcrumb">
    <ul class="breadcrumb-animation">
        <li></li><li></li><li></li><li></li><li></li>
        <li></li><li></li><li></li><li></li><li></li>
    </ul>
    <div class="container text-center py-5" style="max-width: 900px;">
        <h1 class="display-3 mb-4 wow fadeInDown">Рецепти</h1>
    </div>
</div>
<!-- Header End -->

<!-- Filter Buttons -->
<div class="filter-container" style="margin-top: -70px;">
    <a th:href="${currentCategory == 'Закуска'} ? @{/articles(page=0, size=10)} : @{/articles(page=0, size=10, category='Закуска')}"
       class="filter-btn"
       th:classappend="${currentCategory == 'Закуска'} ? 'active' : ''">
        <img src="https://life-app.bbca.bg/img/recipes/breakfast.png" class="first-r-ico" alt="ico" style="margin-top: -20px;">
        Закуска
    </a>

    <a th:href="${currentCategory == 'Обяд'} ? @{/articles(page=0, size=10)} : @{/articles(page=0, size=10, category='Обяд')}"
       class="filter-btn"
       th:classappend="${currentCategory == 'Обяд'} ? 'active' : ''">
        <img src="https://life-app.bbca.bg/img/recipes/lunch.png" class="" alt="ico">
        Обяд
    </a>

    <a th:href="${currentCategory == 'Вечеря'} ? @{/articles(page=0, size=10)} : @{/articles(page=0, size=10, category='Вечеря')}"
       class="filter-btn"
       th:classappend="${currentCategory == 'Вечеря'} ? 'active' : ''">
        <img src="https://life-app.bbca.bg/img/recipes/dinner.png" class="" alt="ico">
        Вечеря
    </a>

    <a th:href="${currentCategory == 'Снаксове'} ? @{/articles(page=0, size=10)} : @{/articles(page=0, size=10, category='Снаксове')}"
       class="filter-btn"
       th:classappend="${currentCategory == 'Снаксове'} ? 'active' : ''">
        <img src="https://life-app.bbca.bg/img/recipes/snacks.png" class="" alt="ico">
        Снаксове
    </a>
</div>

<div class="recipes-container">
    <h2 class="section-title">Предложения за Рецепти</h2>

    <div id="recipesGrid">
        <!-- Thymeleaf Recipe Cards -->
        <a th:each="article : ${articles}"
           th:href="@{/articles/{id}(id=${article.id})}"
           class="recipe-card">
            <div class="recipe-content">
                <div>
                    <div class="recipe-title" th:text="${article.title}">Ципура с картофи на фурна...</div>
                </div>
                <div class="recipe-meta">
                    <div class="recipe-meta-item" th:if="${article.calories != null and article.calories > 0}">
                        <span th:text="'калории: ' + ${article.calories} + ' kcal'">калории: 0 kcal</span>
                    </div>
                    <div class="recipe-meta-item" th:if="${article.hours != null and article.hours > 0 or article.minutes != null and article.minutes > 0}">
                        <span th:text="'време: ' + ${(article.hours != null and article.hours > 0 ? article.hours + ' ч. ' : '') + (article.minutes != null and article.minutes > 0 ? article.minutes + ' мин.' : '')}">време: 35 мин.</span>
                    </div>
                </div>
            </div>
            <img th:src="@{/img/{file}(file=${article.thumbnailPicture})}"
                 th:alt="${article.title}"
                 class="recipe-image">
        </a>
    </div>

    <div id="noRecipesMessage" class="no-recipes" th:if="${#lists.isEmpty(articles)}">
        <p>Все още няма добавени рецепти в тази категория.</p>
    </div>

    <!-- Pagination -->
    <div class="pagination-container" th:if="${totalPages > 1}">
        <a th:href="@{/articles(page=${currentPage - 1}, size=10, category=${currentCategory})}"
           class="pagination-btn"
           th:classappend="${currentPage == 0} ? 'disabled' : ''">
            ‹
        </a>

        <span class="page-info">
            Страница <span th:text="${currentPage + 1}">1</span> от <span th:text="${totalPages}">1</span>
        </span>

        <a th:href="@{/articles(page=${currentPage + 1}, size=10, category=${currentCategory})}"
           class="pagination-btn"
           th:classappend="${currentPage >= totalPages - 1} ? 'disabled' : ''">
            ›
        </a>
    </div>
</div>

<div class="content-spacer" style="height: 80px;"></div>
<style>
    .navbar {
        justify-content: center; /* Center the navbar content */
        position: relative; /* Allows absolute positioning for the back icon */
    }
    .navbar-brand {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
    }
    .back-icon {
        position: absolute;
        left: 20px;
        top: 50%;
        transform: translateY(-50%);
        cursor: pointer;
    }

    .bottom-nav {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        background: #F8F8F8;
        box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.1);
        display: flex;
        justify-content: space-around;
        padding: 10px 0;
        z-index: 10;
    }

    .nav-item {
        text-align: center;
        font-size: 14px;
        color: #8E8E93; /* Default gray */
        display: flex;
        flex-direction: column;
        align-items: center;
        transition: color 0.3s ease-in-out;
    }

    .nav-item i {
        font-size: 24px; /* Adjust icon size */
        margin-bottom: 5px;
    }

    .nav-item p {
        margin: 0;
        font-size: 12px;
    }

    /* Active Item */
    .nav-item.active {
        color: #2E1E46; /* Dark purple */
        font-weight: bold;
    }

    .nav-item.active i {
        color: #2E1E46;
    }

</style>
<th:block th:insert="~{fragments/footer}"></th:block>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.1.3/js/bootstrap.bundle.min.js"></script>
</body>
</html>
