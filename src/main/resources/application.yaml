server:
  port: 8081
spring:
  thymeleaf:
    enabled: true
    prefix: classpath:/templates/
    suffix: .html
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 20MB
  mvc:
    view:
      prefix: /templates/
      suffix: .html
  web:
    resources:
      static-locations: classpath:/static/
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME}
    password: ${GMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  pending:
    requests:
      file: ./pending-requests.json
backend:
  base-url: ${BACKEND_BASE}
  # src/main/resources/application.yml
frontend:
  login-url: "/login"
  redirect-url: "/process-oauth2"
eureka:
  client:
    serviceUrl:
      defaultZone: ${BACKEND}
gemini:
  api:
    key: ${GOOGLE_AI}
    url: "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent"
knowledge:
  base:
    directory: "./knowledge-base"